# Optional manual PipeWire filter-chain example for the ASUS ProArt P16 H7607BA.
# Copy the file to a user-owned location and run it with `pipewire -c FILE`.
# Confirm both ALSA sink names below before playback; firmware/UCM may change them.
# The limiter and crossover values are a neutral, openly reproducible graph;
# this file contains no OEM-derived impulse response or EQ/dynamics profile.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Boost the audio thread priority. Ask RTKit directly, as pipewire.conf
    # does: a portal started before rtkit existed reports a realtime budget of
    # zero, which becomes a hard RLIMIT_RTTIME of 0 while RTKit still makes the
    # data thread realtime, and the kernel then kills the host once audio plays.
    { name = libpipewire-module-rt
        args = { rtportal.enabled = false }
        flags = [ ifexists nofail ]
    }

    # The native communication protocol.
    { name = libpipewire-module-protocol-native }

    # Lets this process provide nodes to PipeWire.
    { name = libpipewire-module-client-node }

    # Wraps nodes in an adapter with a converter and resampler.
    { name = libpipewire-module-adapter }

    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "p16_two_way_split"
            node.description = "P16 two-way band splitter"
            media.class = "Audio/Sink/Internal"
            combine.latency-compensate = true
            combine.props = {
                audio.position = [ FL FR RL RR ]
                priority.session = 0
                priority.driver = 0
            }
            stream.props = {
                stream.dont-remix = true
                node.dont-fallback = true
                node.dont-move = true
            }
            stream.rules = [
                {   matches = [ { media.class = "Audio/Sink"
                                  node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Speaker__sink" } ]
                    actions = { create-stream = {
                        combine.audio.position = [ FL FR ]
                        audio.position = [ FL FR ]
                    } }
                }
                {   matches = [ { media.class = "Audio/Sink"
                                  node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Headphones__sink" } ]
                    actions = { create-stream = {
                        combine.audio.position = [ RL RR ]
                        audio.position = [ FL FR ]
                    } }
                }
            ]
        }
    }


    # Stereo sink -> limiter -> LR4 crossover -> 4 channels (woofer L/R, tweeter L/R).
    # LR4 = two cascaded 2nd-order Butterworth sections (Q 0.7071) per side.
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "P16 neutral two-way"
            media.name = "P16 neutral two-way"
            filter.graph = {
                nodes = [
                    { type = lv2 name = limiter
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { g_in = 1 g_out = 1 th = 0.8912509381
                                    mode = 0 lk = 1 at = 1 rt = 5 slink = 100
                                    alr = 0 boost = 0 }
                    }
                    { type = builtin label = bq_lowpass  name = wL1 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_lowpass  name = wL2 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_lowpass  name = wR1 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_lowpass  name = wR2 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_highpass name = tL1 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_highpass name = tL2 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_highpass name = tR1 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_highpass name = tR2 control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                ]
                links = [
                    { output = "limiter:out_l" input = "wL1:In" }
                    { output = "limiter:out_l" input = "tL1:In" }
                    { output = "limiter:out_r" input = "wR1:In" }
                    { output = "limiter:out_r" input = "tR1:In" }
                    { output = "wL1:Out" input = "wL2:In" }
                    { output = "wR1:Out" input = "wR2:In" }
                    { output = "tL1:Out" input = "tL2:In" }
                    { output = "tR1:Out" input = "tR2:In" }
                ]
                inputs  = [ "limiter:in_l" "limiter:in_r" ]
                outputs = [ "wL2:Out" "wR2:Out" "tL2:Out" "tR2:Out" ]
            }
            capture.props = {
                node.name = "p16_two_way"
                node.description = "P16 neutral two-way"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                priority.session = 1100
                priority.driver = 1100
            }
            playback.props = {
                node.name = "p16_crossover_output"
                node.passive = true
                node.dont-fallback = true
                node.dont-move = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
                target.object = "p16_two_way_split"
                stream.dont-remix = true
                node.dont-fallback = true
                node.dont-move = true
            }
        }
    }

]
