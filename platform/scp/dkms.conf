PACKAGE_NAME="n1x-scp"
PACKAGE_VERSION="0.2.0"
BUILT_MODULE_NAME[0]="n1x_scp"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build W=1 modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
